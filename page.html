<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zaofang</title>
<meta name="description" content="Zaofang (造坊) is a one-person workshop. It makes tools for writing software.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap">
<style>
$tokens
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--zf-bg); color: var(--zf-text); font: 14px/1.75 var(--zf-font-mono); }
.page { min-height: 100%; display: flex; flex-direction: column; padding: 40px 48px; }
a { color: inherit; text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--zf-link); outline-offset: 2px; }
::selection { background: var(--zf-selection); }
.lock svg { display: block; width: 168px; height: auto; }
main { margin-top: 72px; display: grid; gap: 32px; max-width: 760px; }
p { margin: 0; }
.m { color: var(--zf-text-muted); }
table { border-collapse: collapse; width: 100%; }
td { padding: 6px 24px 6px 0; vertical-align: baseline; }
td:last-child { padding-right: 0; text-align: right; white-space: nowrap; }
footer { margin-top: auto; padding-top: 72px; display: flex; gap: 24px; color: var(--zf-text-muted); }
@media (max-width: 640px) {
  .page { padding: 24px 16px; font-size: 13px; }
  main { margin-top: 48px; }
  td.d { display: none; }
}
</style>
</head>
<body>
<div class="page">
  <a class="lock" href="/" aria-label="造坊 zaofang">$lockup</a>
  <main>
    <p>$lines</p>
    <table>$rows</table>
  </main>
  <footer><a href="$github">$github_label ↗</a><span>$year</span></footer>
</div>
</body>
</html>
